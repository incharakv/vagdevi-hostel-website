<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vagdevi Ladies Hostel</title>

    <style>

        /* ---------- BASIC RESET ---------- */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }


        /* ---------- MAIN HOME PAGE ---------- */

        .home-page {
            width: 100%;
            height: 100vh;

            position: relative;

            background-image: url("images/hostel.jpg");
            background-size: cover;
            background-position: 100%;
            background-repeat: no-repeat;
            background-color: #000;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* ---------- DARK OVERLAY ---------- */

        .overlay {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.42);
        }


        /* ---------- CONTENT ---------- */

        .content {
            position: relative;
            z-index: 2;

            text-align: center;

            color: white;

            width: 90%;
            max-width: 900px;

            padding: 30px;
        }


        /* ---------- HOSTEL NAME ---------- */

        .content h1 {
            font-size: 60px;

            font-weight: 700;

            letter-spacing: 2px;

            margin-bottom: 18px;

            text-shadow:
                2px 2px 5px rgba(0, 0, 0, 0.8),
                0 0 15px rgba(0, 0, 0, 0.5);
        }


        /* ---------- WELCOME TEXT ---------- */

        .content p {
            font-size: 22px;

            letter-spacing: 1px;

            margin-bottom: 40px;

            text-shadow:
                2px 2px 5px rgba(0, 0, 0, 0.8);
        }


        /* ---------- LOGIN BUTTON ---------- */

        .login-button {
            display: inline-block;

            padding: 15px 55px;

            background: white;

            color: #333;

            border: none;

            border-radius: 30px;

            font-size: 19px;

            font-weight: bold;

            text-decoration: none;

            cursor: pointer;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);

            transition: all 0.3s ease;
        }


        /* ---------- BUTTON HOVER ---------- */

        .login-button:hover {
            background: #333;

            color: white;

            transform: translateY(-3px);

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }


        /* ---------- MOBILE RESPONSIVE DESIGN ---------- */

        @media (max-width: 768px) {

            .content h1 {
                font-size: 40px;
            }

            .content p {
                font-size: 18px;

                margin-bottom: 30px;
            }

            .login-button {
                padding: 13px 42px;

                font-size: 17px;
            }
        }


        /* ---------- SMALL MOBILE SCREEN ---------- */

        @media (max-width: 480px) {

            .content h1 {
                font-size: 32px;

                letter-spacing: 1px;
            }

            .content p {
                font-size: 16px;
            }

            .login-button {
                padding: 12px 35px;

                font-size: 16px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         HOME PAGE
    ========================== -->

    <div class="home-page">


        <!-- Dark layer over photograph -->

        <div class="overlay"></div>


        <!-- Main content -->

        <div class="content">

            <h1>
                Vagdevi Ladies Hostel
            </h1>


            <p>
                Welcome to Vagdevi Ladies Hostel
            </p>


            <!-- Login Button -->

            <a
                href="pages/login.html"
                class="login-button"
            >
                Login
            </a>

        </div>

    </div>


</body>

</html>
