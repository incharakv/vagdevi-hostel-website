<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visitor Registration - Vagdevi Ladies Hostel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.55)
                ),
                url("../images/hostel.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }

        .registration-box {
            width: 100%;
            max-width: 500px;

            background: rgba(255, 255, 255, 0.95);

            padding: 35px;

            border-radius: 18px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .registration-box h1 {
            text-align: center;
            color: #7b1fa2;
            margin-bottom: 8px;
        }

        .registration-box h2 {
            text-align: center;
            color: #444;
            font-size: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #7b1fa2;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .register-btn {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #7b1fa2;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .register-btn:hover {
            background: #6a1b9a;
        }

        .register-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .back-link {
            display: block;
            text-align: center;

            margin-top: 18px;

            color: #7b1fa2;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .message {
            display: none;
            text-align: center;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 600px) {

            .registration-box {
                padding: 25px 20px;
            }

            .registration-box h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="registration-box">

        <h1>Vagdevi Ladies Hostel</h1>

        <h2>Visitor Registration</h2>

        <div id="message" class="message"></div>

        <form id="registrationForm">

            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your 10-digit phone number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >
            </div>

            <div class="form-group">
                <label for="address">Address</label>

                <textarea
                    id="address"
                    name="address"
                    placeholder="Enter your address"
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label for="language">Select Language</label>

                <select
                    id="language"
                    name="language"
                    required
                >
                    <option value="">Select Language</option>

                    <option value="English">
                        English
                    </option>

                    <option value="Kannada">
                        ಕನ್ನಡ
                    </option>
                </select>
            </div>

            <button
                type="submit"
                class="register-btn"
                id="registerButton"
            >
                Register & Continue
            </button>

        </form>

        <a
            href="/pages/login.html"
            class="back-link"
        >
            ← Back to Login
        </a>

    </div>

    <script>

        const registrationForm =
            document.getElementById("registrationForm");

        const registerButton =
            document.getElementById("registerButton");

        const message =
            document.getElementById("message");


        registrationForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const name =
                    document.getElementById("name").value.trim();

                const phone =
                    document.getElementById("phone").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const address =
                    document.getElementById("address").value.trim();

                const language =
                    document.getElementById("language").value;


                // Check phone number
                if (!/^[0-9]{10}$/.test(phone)) {

                    showMessage(
                        "Please enter a valid 10-digit phone number.",
                        "error"
                    );

                    return;
                }


                // Check language
                if (language !== "English" && language !== "Kannada") {

                    showMessage(
                        "Please select a language.",
                        "error"
                    );

                    return;
                }


                registerButton.disabled = true;
                registerButton.textContent = "Registering...";


                try {

                    // Send registration data to our server
                    const response = await fetch(
                        "/api/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                name: name,
                                phone: phone,
                                email: email,
                                address: address,
                                language: language
                            })
                        }
                    );


                    const result = await response.json();


                    if (response.ok && result.success) {

                        // Save selected language
                        localStorage.setItem(
                            "selectedLanguage",
                            language
                        );


                        showMessage(
                            "Registration successful! Redirecting...",
                            "success"
                        );


                        // Go to dashboard
                        setTimeout(function () {

                            window.location.href =
                                "/pages/dashboard.html";

                        }, 1000);

                    } else {

                        showMessage(
                            result.message ||
                            "Registration failed. Please try again.",
                            "error"
                        );

                        registerButton.disabled = false;

                        registerButton.textContent =
                            "Register & Continue";
                    }

                } catch (error) {

                    console.error(
                        "Registration Error:",
                        error
                    );


                    showMessage(
                        "Unable to connect to the server. Please make sure the server is running.",
                        "error"
                    );


                    registerButton.disabled = false;

                    registerButton.textContent =
                        "Register & Continue";
                }

            }
        );


        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " +
                (
                    type === "success"
                        ? "success-message"
                        : "error-message"
                );

            message.style.display = "block";
        }

    </script>

</body>

</html>
