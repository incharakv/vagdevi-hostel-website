<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visitor Registration - Vagdevi Ladies Hostel</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.50),
                    rgba(0, 0, 0, 0.50)
                ),
                url("../images/hostel.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            padding: 20px;
        }

        .registration-box {
            width: 100%;
            max-width: 500px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .registration-box h1 {
            text-align: center;

            color: #333;

            margin-bottom: 10px;

            font-size: 30px;
        }

        .registration-box .subtitle {
            text-align: center;

            color: #666;

            margin-bottom: 30px;

            font-size: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #7b1fa2;
        }

        .form-group textarea {
            height: 80px;

            resize: vertical;
        }

        .register-button {
            width: 100%;

            padding: 14px;

            margin-top: 10px;

            border: none;

            border-radius: 25px;

            background: #333;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .register-button:hover {
            background: #555;

            transform: translateY(-2px);
        }

        .register-button:disabled {
            background: #999;

            cursor: not-allowed;

            transform: none;
        }

        .message {
            display: none;

            text-align: center;

            margin-bottom: 18px;

            padding: 12px;

            border-radius: 8px;

            font-weight: bold;

            line-height: 1.5;
        }

        .success-message {
            display: block;

            background: #d4edda;

            color: #155724;
        }

        .error-message {
            display: block;

            background: #f8d7da;

            color: #721c24;
        }

        .back-link {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #555;

            text-decoration: none;

            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {

            .registration-box {
                padding: 25px 20px;
            }

            .registration-box h1 {
                font-size: 26px;
            }
        }

    </style>

</head>


<body>

    <div class="registration-box">

        <h1>Visitor Registration</h1>

        <p class="subtitle">
            Please enter your details to continue
        </p>

        <!-- Message area -->

        <div id="message" class="message"></div>


        <!-- Registration Form -->

        <form id="registrationForm">

            <!-- Name -->

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <!-- Phone -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your 10-digit phone number"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    required
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- Address -->

            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    name="address"
                    placeholder="Enter your address"
                    required
                ></textarea>

            </div>


            <!-- Language -->

            <div class="form-group">

                <label for="language">
                    Language
                </label>

                <select
                    id="language"
                    name="language"
                    required
                >

                    <option value="">
                        Select Language
                    </option>

                    <option value="English">
                        English
                    </option>

                    <option value="Kannada">
                        ಕನ್ನಡ
                    </option>

                </select>

            </div>


            <!-- Register Button -->

            <button
                type="submit"
                class="register-button"
                id="registerButton"
            >
                Register & Continue
            </button>

        </form>


        <!-- Back to Home -->

        <a
            href="../index.html"
            class="back-link"
        >
            ← Back to Home
        </a>

    </div>


    <script>

        // Get form elements

        const registrationForm =
            document.getElementById("registrationForm");

        const registerButton =
            document.getElementById("registerButton");

        const message =
            document.getElementById("message");


        // Registration form submit

        registrationForm.addEventListener(
            "submit",
            async function (event) {

                // IMPORTANT:
                // Prevent page refresh

                event.preventDefault();


                // Get values

                const name =
                    document.getElementById("name")
                        .value
                        .trim();

                const phone =
                    document.getElementById("phone")
                        .value
                        .trim();

                const email =
                    document.getElementById("email")
                        .value
                        .trim();

                const address =
                    document.getElementById("address")
                        .value
                        .trim();

                const language =
                    document.getElementById("language")
                        .value;


                // Check phone number

                if (!/^[0-9]{10}$/.test(phone)) {

                    showMessage(
                        "Please enter a valid 10-digit phone number.",
                        "error"
                    );

                    return;
                }


                // Check language

                if (
                    language !== "English" &&
                    language !== "Kannada"
                ) {

                    showMessage(
                        "Please select a language.",
                        "error"
                    );

                    return;
                }


                // Disable button while registering

                registerButton.disabled = true;

                registerButton.textContent =
                    "Registering...";


                try {

                    // Send data to Node.js server

                    const response = await fetch(
                        "/api/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                name: name,

                                phone: phone,

                                email: email,

                                address: address,

                                language: language

                            })
                        }
                    );


                    // Convert server response to JSON

                    const result =
                        await response.json();


                    // Registration successful

                    if (
                        response.ok &&
                        result.success
                    ) {

                        // Save selected language

                        localStorage.setItem(
                            "selectedLanguage",
                            language
                        );


                        // Save visitor name

                        localStorage.setItem(
                            "visitorName",
                            name
                        );


                        // Show success message

                        showMessage(
                            "Registration successful! Redirecting to dashboard...",
                            "success"
                        );


                        // Go to dashboard

                        setTimeout(
                            function () {

                                window.location.href =
                                    "/pages/dashboard.html";

                            },
                            1000
                        );

                    }


                    // Registration failed

                    else {

                        showMessage(
                            result.message ||
                            "Registration failed. Please try again.",
                            "error"
                        );


                        registerButton.disabled =
                            false;

                        registerButton.textContent =
                            "Register & Continue";
                    }

                }


                // Server connection error

                catch (error) {

                    console.error(
                        "Registration Error:",
                        error
                    );


                    showMessage(
                        "Unable to connect to the server. Please make sure the server is running.",
                        "error"
                    );


                    registerButton.disabled =
                        false;

                    registerButton.textContent =
                        "Register & Continue";
                }

            }
        );


        // Show message

        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " +
                (
                    type === "success"
                        ? "success-message"
                        : "error-message"
                );

            message.style.display = "block";
        }

    </script>

</body>

</html>
