    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7fb;
            color: #333;
            min-height: 100vh;
            padding: 40px 6%;
        }

        .page {
            width: 100%;
            max-width: 1250px;
            margin: auto;
        }

        /* HEADER */

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #4b2e83;
            font-size: 34px;
            margin-bottom: 10px;
        }

        .header h2 {
            color: #333;
            font-size: 25px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }

        /* GALLERY */

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
        }

        .gallery-item img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.06);
        }

        /* BACK BUTTON */

        .back-button {
            display: block;
            width: fit-content;
            margin: 45px auto 10px;
            padding: 13px 28px;
            background: #4b2e83;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
            transition: background 0.3s ease,
                        transform 0.2s ease;
        }

        .back-button:hover {
            background: #36215f;
            transform: translateY(-2px);
        }

        /* PHOTO VIEWER */

        .photo-viewer {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            align-items: center;
            justify-content: center;
        }

        .photo-viewer img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.5);
        }

        /* CLOSE BUTTON */

        .close-viewer {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 42px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
        }

        /* PREVIOUS / NEXT */

        .prev-photo,
        .next-photo {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
            padding: 15px;
            user-select: none;
            z-index: 10000;
        }

        .prev-photo {
            left: 20px;
        }

        .next-photo {
            right: 20px;
        }

        .prev-photo:hover,
        .next-photo:hover,
        .close-viewer:hover {
            opacity: 0.7;
        }

        /* TABLET */

        @media (max-width: 1000px) {

            body {
                padding: 35px 4%;
            }

            .gallery {
                grid-template-columns: repeat(3, 1fr);
            }

            .gallery-item img {
                height: 200px;
            }
        }

        /* MOBILE */

        @media (max-width: 700px) {

            body {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 28px;
            }

            .header h2 {
                font-size: 21px;
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .gallery-item img {
                height: 170px;
            }

            .photo-viewer img {
                max-width: 90%;
                max-height: 75%;
            }

            .prev-photo,
            .next-photo {
                font-size: 35px;
                padding: 10px;
            }

            .prev-photo {
                left: 5px;
            }

            .next-photo {
                right: 5px;
            }

            .close-viewer {
                right: 18px;
                top: 10px;
            }
        }

        /* SMALL MOBILE */

        @media (max-width: 450px) {

            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery-item img {
                height: 230px;
            }

            .header h1 {
                font-size: 25px;
            }

            .header h2 {
                font-size: 20px;
            }
        }
    </style>

    <script>

        /* LANGUAGE */

        const selectedLanguage =
            localStorage.getItem("selectedLanguage");

        if (selectedLanguage === "Kannada") {

            document.documentElement.lang = "kn";

            document.getElementById("pageTitle").innerText =
                "ವಸತಿ ನಿಲಯದ ಚಿತ್ರ ಗ್ಯಾಲರಿ";

            document.getElementById("galleryIntro").innerText =
                "ನಮ್ಮ ವಸತಿ ನಿಲಯ, ಸೌಲಭ್ಯಗಳು ಮತ್ತು ಚಟುವಟಿಕೆಗಳ ಕೆಲವು ಚಿತ್ರಗಳು.";

            document.getElementById("backButton").innerText =
                "← ಡ್ಯಾಶ್‌ಬೋರ್ಡ್‌ಗೆ ಹಿಂದೆ";
        }


        /* PHOTO VIEWER */

        const photos =
            document.querySelectorAll(".gallery-item img");

        const photoViewer =
            document.getElementById("photoViewer");

        const viewerImage =
            document.getElementById("viewerImage");

        const closeViewer =
            document.getElementById("closeViewer");

        const prevPhoto =
            document.getElementById("prevPhoto");

        const nextPhoto =
            document.getElementById("nextPhoto");

        let currentPhoto = 0;


        /* OPEN PHOTO */

        photos.forEach((photo, index) => {

            photo.addEventListener("click", function () {

                currentPhoto = index;

                viewerImage.src = photo.src;

                photoViewer.style.display = "flex";
            });

        });


        /* PREVIOUS PHOTO */

        prevPhoto.addEventListener("click", function (event) {

            event.stopPropagation();

            currentPhoto--;

            if (currentPhoto < 0) {
                currentPhoto = photos.length - 1;
            }

            viewerImage.src =
                photos[currentPhoto].src;
        });


        /* NEXT PHOTO */

        nextPhoto.addEventListener("click", function (event) {

            event.stopPropagation();

            currentPhoto++;

            if (currentPhoto >= photos.length) {
                currentPhoto = 0;
            }

            viewerImage.src =
                photos[currentPhoto].src;
        });


        /* CLOSE VIEWER */

        closeViewer.addEventListener("click", function () {

            photoViewer.style.display = "none";
        });


        /* CLOSE WHEN CLICKING OUTSIDE PHOTO */

        photoViewer.addEventListener("click", function (event) {

            if (event.target === photoViewer) {

                photoViewer.style.display = "none";
            }

        });


        /* KEYBOARD CONTROLS */

        document.addEventListener("keydown", function (event) {

            if (photoViewer.style.display !== "flex") {
                return;
            }

            if (event.key === "ArrowLeft") {
                prevPhoto.click();
            }

            if (event.key === "ArrowRight") {
                nextPhoto.click();
            }

            if (event.key === "Escape") {
                closeViewer.click();
            }

        });

    </script>
